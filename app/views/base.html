<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ekte Mat Online{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('menu.index') }}">Ekte Mat Online</a>
    <nav>
      <a href="{{ url_for('menu.index') }}">Menu</a>
      <a href="{{ url_for('cart.index') }}">Cart ({{ cart_count }})</a>
      {% if g.user %}
        <span class="nav-user">{{ g.user.name }}</span>
        <form class="nav-form" method="post" action="{{ url_for('auth.logout') }}">
          <button type="submit" class="link-button">Log out</button>
        </form>
      {% else %}
        <a href="{{ url_for('auth.login') }}">Log in</a>
        <a href="{{ url_for('auth.register') }}">Register</a>
      {% endif %}
    </nav>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
